<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Landing Page</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="">
        <div class="menu-content container">
            <div class="logo">
                <img src="/Logo.png" alt="">
            </div>

            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Service</a></li>
                <li><a href="#">Feature</a></li>
                <li><a href="#">Product</a></li>
                <li><a href="#">Testimonial</a></li>
                <li><a href="#">FAQ</a></li>
            </ul>

            <div class="login-signup-button">
                <button class="outline-btn">Login</button>
                <button class="common-btn">Sign up</button>
            </div>
        </div>
        <header class="container">
            <div class="banner">
                <div class="header-content ">
                    <h1>Lessons and insights <span>from 8 years</span></h1>
                    <p>Where to grow your business as a photographer: site or social media?</p>
                    <button class="common-btn">Register</button>
                </div>
                <div class="header-img">
                    <img src="./Illustration.png" alt="">
                </div>
            </div>
        </header>
    </nav>
    <main>
        <section class="service-container container">
            <div class="service-section">
                <h1>Our Clients</h1>
                <p>We have been working with some Fortune 500+ clients</p>
            </div>
            <div class="logo-layer">
                <div class="service-logo">
                    <img src="./images/Logo-1.png" alt="logo">
                </div>
                <div class="service-logo">
                    <img src="./images/Logo-2.png" alt="logo2">
                </div>
                <div class="service-logo">
                    <img src="./images/Logo-3.png" alt="logo3">
                </div>
                <div class="service-logo">
                    <img src="./images/Logo-4.png" alt="logo4">
                </div>
                <div class="service-logo">
                    <img src="./images/Logo-5.png" alt="logo5">
                </div>
                <div class="service-logo">
                    <img src="./images/Logo.png" alt="logo6">
                </div>
                <div class="service-logo">
                    <img src="./images/Vector.png" alt="logo7">
                </div>
            </div>
        </section>
    </main>
</body>

</html>
